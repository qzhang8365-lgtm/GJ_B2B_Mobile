<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>Icon 382 · 字体与SVG实测</title><style>body{font:14px/1.6 system-ui;margin:24px;color:#101828}h1{font-size:22px}pre{white-space:pre-wrap;font-size:12px}.rows{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.row{padding:12px;border:1px solid #ddd;border-radius:8px;display:grid;grid-template-columns:1fr 96px 96px;gap:8px;align-items:center}.row img,canvas{width:96px;height:96px}iframe{position:absolute;width:1200px;height:800px;left:-1500px;top:0;opacity:0;pointer-events:none}</style><h1>实际网页字体与源 SVG 对照</h1><p>每项左图为网页加载的字体字形，右图为当前源 SVG。</p><pre id="result">加载实际图标页面中…</pre><div class="rows" id="rows"></div><iframe aria-hidden="true" tabindex="-1" id="icons" src="../../preview/icons/index.html?v=20261027-icons382-r2"></iframe><script>
const frame=document.getElementById('icons');frame.onload=async()=>{try{
const w=frame.contentWindow,d=frame.contentDocument;await d.fonts.ready;
const cards=[...d.querySelectorAll('.icon-card')],blank=[],wrong=[],metrics=[];
for(const card of cards){const i=card.querySelector('.icon-glyph'),map=w.ICONFONT_MAP[card.dataset.style][card.dataset.name];if(!i){wrong.push(card.dataset.name+':not-font');continue}
const char=w.getComputedStyle(i,'::before').content.replace(/^['"]|['"]$/g,'');if(char.codePointAt(0)!==parseInt(map.unicode.slice(2),16))wrong.push(card.dataset.name);
const canvas=d.createElement('canvas');canvas.width=96;canvas.height=96;const ctx=canvas.getContext('2d');ctx.font='72px "GJB2B_general_'+card.dataset.style+'"';ctx.textBaseline='middle';ctx.textAlign='center';ctx.fillText(char,48,48);const pixels=ctx.getImageData(0,0,96,96).data;let ink=0;for(let k=3;k<pixels.length;k+=4)if(pixels[k])ink++;if(!ink)blank.push(card.dataset.name);metrics.push({name:card.dataset.name,ink});
if(/file-zip|volume|delete-fill|folder-locked-2-line|system_loading$/.test(card.dataset.name)){const row=document.createElement('div');row.className='row';const label=document.createElement('span');label.textContent=card.dataset.name+' · '+map.unicode;row.append(label);const picture=document.createElement('img');picture.src=canvas.toDataURL();picture.alt='字体';row.append(picture);const source=document.createElement('img');source.src='../../assets/icons/iconfont/'+card.dataset.name+'.svg?v=20261027-icons382-r2';source.alt='SVG';row.append(source);document.getElementById('rows').append(row)}
}
const resources=w.performance.getEntriesByType('resource');const fonts=resources.filter(r=>/\.woff2?\?|\.ttf\?/.test(r.name)).map(r=>({url:r.name,status:r.responseStatus}));const failures=resources.filter(r=>r.responseStatus>=400).map(r=>r.name);
const result={summary:d.getElementById('summary').textContent,cards:cards.length,styles:{line:cards.filter(c=>c.dataset.style==='line').length,fill:cards.filter(c=>c.dataset.style==='fill').length},fonts:[...d.fonts].map(f=>({family:f.family,status:f.status})),fontRequests:fonts,wrongCodepoints:wrong,emptyGlyphs:blank,failedResources:failures,checks:metrics.length};document.getElementById('result').textContent=JSON.stringify(result,null,2);
}catch(e){document.getElementById('result').textContent='ERROR '+e.stack}}
</script></html>
