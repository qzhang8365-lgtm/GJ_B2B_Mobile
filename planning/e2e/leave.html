<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>请假申请</title>
<!-- 端到端验证（新流程第 1 轮）：按 SKILL.md 6 步生成——模式 form、page-rules、组件 mapping 写法、quick-reference、verify-page。原型，非生产代码；数据为虚构。运行容器按 H5 处理。 -->
<link rel="stylesheet" href="../../assets/styles/gj-b2b-mobile-tokens.css">
<link rel="stylesheet" href="../../assets/styles/gj-b2b-mobile-components.css">
<style>
html{font-size:min(calc(100vw / 3.75),120px)}
:root{--safe-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font-size:.14rem;line-height:.22rem;font-family:var(--ds-font-family-ui);color:var(--ds-text-primary);background:var(--ds-background-background)}
.top{position:sticky;top:0;z-index:10;background:var(--ds-background-container)}
.body{display:flex;flex-direction:column;gap:var(--space-card-l1-gap);padding:var(--space-12) var(--space-page-margin-x) calc(.64rem + var(--space-24) + var(--safe-bottom))}
.body.done{padding-bottom:calc(var(--space-24) + var(--safe-bottom))}
/* 表单卡：卡片内首个表单项不留上内边距（PR-007） */
.gj-m-card-body>.gj-m-form-item:first-child{padding-top:0}
.row2{display:flex;align-items:center;gap:var(--space-12)}
.row2>.gj-m-datepicker{flex:1 1 auto;min-width:0}
.row2>.gj-m-radio-group{flex:none}
.dur{margin:0;font-variant-numeric:tabular-nums}
.dur b{font-size:var(--ds-type-h4-cn-s-font-size);line-height:var(--ds-type-h4-cn-s-line-height)}
.note{margin:0;color:var(--ds-text-tiatery);font-size:var(--ds-type-p5-cn-r-font-size);line-height:var(--ds-type-p5-cn-r-line-height)}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:var(--space-12) var(--space-page-margin-x) calc(var(--space-12) + var(--safe-bottom));background:var(--ds-background-container);box-shadow:0 -1px 0 var(--ds-border-default)}
.layer{position:fixed;inset:0;z-index:30}
.done-box{display:flex;flex-direction:column;align-items:center;gap:var(--space-8);padding:var(--space-24) 0;text-align:center}
.done-box img{width:.64rem;height:.64rem}
.done-box h2{margin:var(--space-8) 0 0;font-size:var(--ds-type-h3-cn-s-font-size);line-height:var(--ds-type-h3-cn-s-line-height);font-weight:var(--ds-type-h3-cn-s-font-weight)}
.done-box .gj-m-button{margin-top:var(--space-16)}
</style>
</head>
<body>
<div class="top"><header class="gj-m-navbar" aria-label="页面导航"><div class="gj-m-navbar-left"><button class="gj-m-navbar-action gj-m-navbar-back" type="button" id="back" aria-label="返回上一页"><span class="gj-icon gj-icon-24" style="--gj-icon:url('../../assets/icons/iconfont/icf_Arrow_left.svg')" aria-hidden="true"></span></button></div><div class="gj-m-navbar-center"><span class="gj-m-navbar-title">请假申请</span></div><div class="gj-m-navbar-right"></div></header></div>
<main class="body" id="main"></main>
<div class="bar" id="bar"><div class="gj-m-form-actions"><button type="button" class="gj-m-button gj-m-button-large gj-m-button-tertiary" id="draft">保存草稿</button><button type="button" class="gj-m-button gj-m-button-large gj-m-button-primary" id="submit">提交申请</button></div></div>
<div id="layer"></div>
<div id="toast"></div>
<script>
(()=>{
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const I=n=>`<span class="gj-icon" style="--gj-icon:url('../../assets/icons/iconfont/${n}.svg')" aria-hidden="true"></span>`;
const pad=n=>String(n).padStart(2,'0'),D=(y,m,d)=>new Date(y,m,d),fmt=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,same=(a,b)=>a&&b&&+a===+b;
const TODAY=D(2026,9,19),ANNUAL=5;
const TYPES=['年假','事假','病假','调休','婚假','产假'];
let v={type:'',start:null,sh:'上午',end:null,eh:'下午',reason:'',files:[]},err={},dirty=false,done=false,opener=null;

/* 时长：按自然日计，半天 0.5（原型不扣节假日） */
const days=()=>{if(!v.start||!v.end)return 0;const n=Math.round((v.end-v.start)/864e5);let d=n+1;if(v.sh==='下午')d-=.5;if(v.eh==='上午')d-=.5;return d};
const radios=(name,val,label)=>`<div class="gj-m-radio-group" role="radiogroup" aria-label="${label}">${['上午','下午'].map(t=>`<label class="gj-m-radio"><input type="radio" class="gj-m-radio-input" name="${name}" value="${t}"${t===val?' checked':''}><span class="gj-m-radio-icon" aria-hidden="true"></span><span class="gj-m-radio-label">${t}</span></label>`).join('')}</div>`;
const msg=(k)=>err[k]?`<div class="gj-m-select-message" role="alert" id="e-${k}">${err[k]}</div>`:'';
const label=(t,req,desc)=>`<span class="gj-m-form-label"><span class="gj-m-form-label-text">${t}</span>${req?'<span class="gj-m-form-required" aria-label="必填">*</span>':''}${desc?`<span class="gj-m-form-desc">${desc}</span>`:''}</span>`;
const dateBtn=(k,lab)=>`<button type="button" class="gj-m-select gj-m-datepicker" data-date="${k}" aria-haspopup="dialog" aria-expanded="false" aria-label="${lab}"${err[k]?` aria-invalid="true" aria-describedby="e-${k}"`:''}>${I('icf_system_calendar')}<span class="gj-m-select-value${v[k]?'':' is-placeholder'}">${v[k]?fmt(v[k]):'选择日期'}</span></button>`;
const card=(t,body)=>`<section class="gj-m-card"><div class="gj-m-card-head"><div class="gj-m-card-header"><h3 class="gj-m-card-title">${t}</h3></div></div><div class="gj-m-card-body">${body}</div></section>`;

function flow(){const d=days(),steps=[['finish','我','提交申请'],['wait','王芳','部门经理审批']];if(d>3)steps.push(['wait','陈刚','分管领导审批（超过 3 天）']);steps.push(['wait','人力资源部','备案']);
  return `<ol class="gj-m-steps" data-direction="vertical" aria-label="审批流程">${steps.map(([s,who,what],i)=>`<li class="gj-m-step" data-state="${i===0?'process':s}"${i===0?' aria-current="step"':''}><div class="gj-m-step-mark" aria-hidden="true"><span class="gj-m-step-dot"></span></div><div class="gj-m-step-copy"><p class="gj-m-step-title">${who}</p><p class="gj-m-step-description">${what}</p></div></li>`).join('')}</ol>`}

function render(){
  if(done){$('main').className='body done';$('main').innerHTML=card('申请结果',`<div class="done-box"><img src="../../assets/icons/glassicon/png/success.png" alt=""><h2>提交成功</h2><p class="note">${esc(v.type)} ${days()} 天 · 已提交至王芳审批</p><button type="button" class="gj-m-button gj-m-button-secondary" id="toList">查看申请记录</button></div>`);$('bar').hidden=true;$('toList').addEventListener('click',()=>toast('进入申请记录（原型不跳转）'));return}
  const d=days();
  const info=card('请假信息',
    `<div class="gj-m-form-item" data-k="type">${label('请假类型',1)}<button type="button" class="gj-m-select" id="typeBtn" aria-haspopup="dialog" aria-expanded="false" aria-label="请假类型"${err.type?' aria-invalid="true" aria-describedby="e-type"':''}><span class="gj-m-select-value${v.type?'':' is-placeholder'}">${v.type||'请选择'}</span><span class="gj-m-select-arrow">${I('icf_Arrow_down')}</span></button>${msg('type')}${v.type==='年假'?`<div class="gj-m-notice gj-m-notice-small" data-tone="message" role="status">${I('icf_system_info')}<span class="gj-m-notice-text">年假剩余 ${ANNUAL} 天，有效期至 2026-12-31</span></div>`:''}</div>`+
    `<div class="gj-m-form-item" data-k="start">${label('开始时间',1)}<div class="row2">${dateBtn('start','开始日期')}${radios('sh',v.sh,'开始时段')}</div>${msg('start')}</div>`+
    `<div class="gj-m-form-item" data-k="end">${label('结束时间',1)}<div class="row2">${dateBtn('end','结束日期')}${radios('eh',v.eh,'结束时段')}</div>${msg('end')}</div>`+
    `<div class="gj-m-form-item">${label('请假时长')}<p class="dur" aria-live="polite">${d>0?`<b>${d}</b> 天`:'<span class="note">选择起止时间后自动计算</span>'}</p></div>`);
  const why=card('请假事由',
    `<div class="gj-m-form-item" data-k="reason">${label('事由',1)}<label class="gj-m-textarea${err.reason?' is-error':''}"><textarea id="reason" rows="3" maxlength="200" placeholder="说明请假原因与工作交接安排" aria-label="事由"${err.reason?' aria-invalid="true" aria-describedby="e-reason"':''}>${esc(v.reason)}</textarea><span class="gj-m-textarea-count">${v.reason.length}/200</span></label>${err.reason?`<div class="gj-m-input-message" role="alert" id="e-reason">${err.reason}</div>`:''}</div>`+
    `<div class="gj-m-form-item">${label('附件',0,v.type==='病假'?'（病假请上传病历或诊断证明）':'（选填）')}<div class="gj-m-upload"><div class="gj-m-upload-head"><button type="button" class="gj-m-button gj-m-button-tertiary gj-m-button-large" id="up">${I('icf_file_upload')}<span>上传</span></button><p class="gj-m-upload-tip">支持 JPG、PNG、PDF，单个不超过 10MB</p></div>${v.files.length?`<ul class="gj-m-upload-list">${v.files.map((f,i)=>{const k=f.lastIndexOf('.');return `<li class="gj-m-upload-item"><span class="gj-m-upload-item-icon-slot"><img class="gj-m-upload-item-icon" src="../../assets/icons/fileicon/24px-${/pdf$/.test(f)?'pdf':'img'}.svg" alt=""></span><span class="gj-m-upload-item-name"><span class="gj-m-upload-item-base">${esc(f.slice(0,k))}</span><span class="gj-m-upload-item-ext">${esc(f.slice(k))}</span></span><button type="button" class="gj-m-upload-item-remove" data-rm="${i}" aria-label="删除 ${esc(f)}"><span class="gj-icon" aria-hidden="true"></span></button></li>`}).join('')}</ul>`:''}</div></div>`);
  const appr=card('审批流程',flow());
  $('main').innerHTML=info+why+appr;
  bind()}

function bind(){
  $('typeBtn').addEventListener('click',e=>openType(e.currentTarget));
  document.querySelectorAll('[data-date]').forEach(b=>b.addEventListener('click',e=>openDate(b.dataset.date,e.currentTarget)));
  document.querySelectorAll('.row2 input[type=radio]').forEach(r=>r.addEventListener('change',()=>{v[r.name]=r.value;dirty=true;check(['end']);render()}));
  const ta=$('reason');ta.addEventListener('input',()=>{v.reason=ta.value;dirty=true;ta.parentElement.querySelector('.gj-m-textarea-count').textContent=ta.value.length+'/200';if(err.reason&&ta.value.trim()){delete err.reason;ta.parentElement.classList.remove('is-error');ta.removeAttribute('aria-invalid');const m=$('e-reason');if(m)m.remove()}});
  $('up').addEventListener('click',()=>{v.files.push(v.files.length%2?'诊断证明.pdf':'病历照片.jpg');dirty=true;render();toast('已上传（原型）')});
  document.querySelectorAll('[data-rm]').forEach(b=>b.addEventListener('click',()=>{v.files.splice(+b.dataset.rm,1);render();toast('已删除')}))}

/* 校验：提交时全量校验；之后修改字段时，只更新已显示错误的字段（修改后错误立即消失或更新） */
function validate(){const e={};
  if(!v.type)e.type='请选择请假类型';
  if(!v.start)e.start='请选择开始时间';
  if(!v.end)e.end='请选择结束时间';else if(v.start&&days()<=0)e.end='结束时间不能早于开始时间';else if(v.type==='年假'&&days()>ANNUAL)e.end=`年假余额不足（剩余 ${ANNUAL} 天）`;
  if(!v.reason.trim())e.reason='请填写请假事由';
  return e}
function check(keys){const e=validate();if(!keys){err=e;return e}
  keys.forEach(x=>{if(x in err){if(e[x])err[x]=e[x];else delete err[x]}});return e}

/* 通用弹层 */
const toast=t=>{const h=$('toast');h.innerHTML=`<div class="gj-m-toast-layer" role="status" style="position:fixed"><div class="gj-m-notice" data-tone="default"><span class="gj-m-notice-text">${esc(t)}</span></div></div>`;clearTimeout(toast.t);toast.t=setTimeout(()=>h.innerHTML='',3000)};
const openLayer=(html,from)=>{if(from)opener=from;$('layer').innerHTML=`<div class="layer">${html}</div>`;document.body.style.overflow='hidden';const L=$('layer').firstElementChild;L.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',closeLayer));const m=L.querySelector('.gj-m-popup,.gj-m-dialog');m.addEventListener('click',e=>{if(e.target===m)closeLayer()});L.querySelector('[role=dialog]').focus();return L};
const closeLayer=()=>{$('layer').innerHTML='';document.body.style.overflow='';if(opener){const id=opener.id||opener.dataset.date;const el=opener.id?$(opener.id):document.querySelector(`[data-date="${id}"]`);(el||opener).focus()}opener=null};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('layer').innerHTML)closeLayer()});
const popup=(title,body,okDisabled)=>`<div class="gj-m-popup"><div class="gj-m-popup-panel gj-m-popup-dialog" role="dialog" aria-modal="true" aria-labelledby="popT" tabindex="-1"><div class="gj-m-popup-header" data-align="center"><div class="gj-m-popup-header-row"><span class="gj-m-popup-title" id="popT">${title}</span><button type="button" class="gj-m-popup-close" aria-label="关闭" data-close><span class="gj-icon" aria-hidden="true"></span></button></div></div><div class="gj-m-popup-body">${body}</div><div class="gj-m-popup-footer"><button type="button" class="gj-m-button gj-m-button-large gj-m-button-tertiary" data-close>取消</button><button type="button" class="gj-m-button gj-m-button-large gj-m-button-primary" data-ok${okDisabled?' disabled':''}>确认</button></div></div></div>`;

/* 选择列表弹层：按 selection-list 的 popupSingle 写法，列表直接放在弹层面板内（不包 .gj-m-popup-body，列表项自带左右 16） */
function openType(btn){let t=v.type;const draw=()=>{const L=openLayer(`<div class="gj-m-popup"><div class="gj-m-popup-panel" role="dialog" aria-modal="true" aria-labelledby="popT" tabindex="-1"><div class="gj-m-popup-header"><span class="gj-m-popup-title" id="popT">请假类型</span><button type="button" class="gj-m-popup-close" aria-label="关闭" data-close><span class="gj-icon" aria-hidden="true"></span></button></div><div class="gj-m-selection" role="radiogroup" aria-label="请假类型">${TYPES.map(x=>`<button type="button" class="gj-m-selection-item" role="radio" aria-checked="${x===t}" data-t="${x}"><span class="gj-m-selection-item-content"><span class="gj-m-selection-item-text">${x}</span><span class="gj-m-selection-check"><span class="gj-icon" aria-hidden="true"></span></span></span></button>`).join('')}</div><div class="gj-m-popup-footer"><button type="button" class="gj-m-button gj-m-button-large gj-m-button-tertiary" data-close>取消</button><button type="button" class="gj-m-button gj-m-button-large gj-m-button-primary" data-ok${t?'':' disabled'}>确定</button></div></div></div>`,btn);
  L.querySelectorAll('[data-t]').forEach(b=>b.addEventListener('click',()=>{t=b.dataset.t;draw();document.querySelector(`[data-t="${t}"]`).focus()}));
  L.querySelector('[data-ok]').addEventListener('click',()=>{v.type=t;dirty=true;if(err.type||err.end)check(['type','end']);closeLayer();render();$('typeBtn').focus()})};draw()}

function calendar(y,m,sel){const sw=D(y,m,1).getDay(),rows=Math.ceil((sw+D(y,m+1,0).getDate())/7)*7;let h='';
  for(let i=0;i<rows;i++){const d=D(y,m,1-sw+i),out=d.getMonth()!==m,c=['gj-m-calendar-day'];if(same(d,TODAY))c.push('is-today');if(!out&&same(d,sel))c.push('is-selected');
    h+=`<button type="button" class="${c.join(' ')}" data-d="${fmt(d)}"${out?' disabled':''} aria-label="${d.getMonth()+1}月${d.getDate()}日${same(d,TODAY)?'，今天':''}"${!out&&same(d,sel)?' aria-pressed="true"':''}><span>${d.getDate()}</span></button>`}
  const nav=(n,l)=>`<button type="button" class="gj-m-calendar-nav" data-nav="${n}" aria-label="${l}"><span class="gj-icon" aria-hidden="true"></span></button>`;
  return `<div class="gj-m-calendar"><div class="gj-m-calendar-header">${nav(-12,'上一年')}${nav(-1,'上一月')}<div class="gj-m-calendar-title" aria-live="polite">${y} - ${pad(m+1)}</div>${nav(1,'下一月')}${nav(12,'下一年')}</div><div class="gj-m-calendar-week" aria-hidden="true">${'日一二三四五六'.split('').map(w=>`<span>${w}</span>`).join('')}</div><div class="gj-m-calendar-days">${h}</div></div>`}
function openDate(k,btn){let sel=v[k],base=sel||v.start||TODAY,y=base.getFullYear(),m=base.getMonth();
  const draw=()=>{const L=openLayer(popup(k==='start'?'开始日期':'结束日期',calendar(y,m,sel),!sel),btn);
    L.querySelectorAll('.gj-m-calendar-nav').forEach(n=>n.addEventListener('click',()=>{const d=D(y,m+ +n.dataset.nav,1);y=d.getFullYear();m=d.getMonth();draw()}));
    L.querySelectorAll('.gj-m-calendar-day:not(:disabled)').forEach(c=>c.addEventListener('click',()=>{const [a,b,d]=c.dataset.d.split('-').map(Number);sel=D(a,b-1,d);draw();document.querySelector(`[data-d="${c.dataset.d}"]`).focus()}));
    L.querySelector('[data-ok]').addEventListener('click',()=>{v[k]=sel;if(k==='start'&&!v.end)v.end=sel;dirty=true;check(['start','end']);closeLayer();render()})};draw()}

/* 提交、草稿、返回 */
$('submit').addEventListener('click',()=>{const e=check();render();const n=Object.keys(e).length;
  if(n){toast(`还有 ${n} 项必填未完成`);const first=document.querySelector('.gj-m-form-item[data-k="'+Object.keys(e)[0]+'"]');first.scrollIntoView({block:'center'});(first.querySelector('button,textarea')).focus();return}
  const b=$('submit');b.disabled=true;b.textContent='提交中...';setTimeout(()=>{done=true;dirty=false;render();window.scrollTo(0,0);toast('提交成功')},600)});
$('draft').addEventListener('click',()=>{dirty=false;toast('草稿已保存')});
$('back').addEventListener('click',e=>{if(!dirty||done){toast('返回上一页（原型不跳转）');return}
  const L=openLayer(`<div class="gj-m-dialog"><div class="gj-m-dialog-panel" role="dialog" aria-modal="true" aria-labelledby="dlT" aria-describedby="dlM" tabindex="-1"><div class="gj-m-dialog-header"><h2 class="gj-m-dialog-title" id="dlT">保存为草稿？</h2><p class="gj-m-dialog-message" id="dlM">当前填写内容尚未提交，可保存为草稿下次继续。</p></div><div class="gj-m-dialog-footer"><button type="button" class="gj-m-button gj-m-button-large gj-m-button-tertiary" data-leave>不保存</button><button type="button" class="gj-m-button gj-m-button-large gj-m-button-primary" data-save>保存草稿</button></div></div></div>`,e.currentTarget);
  L.querySelector('[data-leave]').addEventListener('click',()=>{closeLayer();toast('已放弃，返回上一页（原型不跳转）')});
  L.querySelector('[data-save]').addEventListener('click',()=>{dirty=false;closeLayer();toast('草稿已保存，返回上一页（原型不跳转）')})});
render();
})();
</script>
</body>
</html>
