<script>
(()=>{
const I=n=>`<span class="gj-icon" aria-hidden="true" style="--gj-icon:url('../../assets/icons/iconfont/${n}.svg')"></span>`;
const files=[['机票行程单.pdf','pdf','182.4KB'],['酒店发票.pdf','pdf','96.0KB'],['费用明细.xlsx','excel','24.6KB']];
document.getElementById('files').innerHTML=files.map(([n,t,s])=>{const i=n.lastIndexOf('.');return `<li class="gj-m-file-list-item"><span class="gj-m-file-list-icon"><img alt="" src="../../assets/icons/fileicon/24px-${t}.svg"></span><span class="gj-m-file-list-content"><span class="gj-m-file-list-name" title="${n}"><span class="gj-m-file-list-base">${n.slice(0,i)}</span><span class="gj-m-file-list-ext">${n.slice(i)}</span></span><span class="gj-m-file-list-info"><span>李明 上传</span><span>${s}</span></span></span><span class="gj-m-file-list-actions"><button class="gj-m-file-list-action" type="button" aria-label="查看 ${n}" data-view="${n}">${I('icf_system_eye')}</button></span></li>`}).join('');
let flow=[['finish','10-16 17:20','李明 提交申请',''],['finish','10-17 09:12','王芳（部门经理）同意','情况属实'],['process','','我 审批中','分管领导'],['wait','','财务复核','']];
const drawFlow=()=>{window.GJMarkup.root='../../';document.getElementById('flowMount').innerHTML=window.GJMarkup.render('steps','timeline',{id:'flow',label:'审批流程',items:flow.map(([state,time,title,desc])=>({state,time:time||'00-00 00:00',placeholder:!time,current:state==='process',title:window.GJMarkup.esc(title),desc:window.GJMarkup.esc(desc)}))})};
drawFlow();
const toast=t=>{const h=document.getElementById('toast');h.innerHTML=`<div class="gj-m-toast-layer" role="status" style="position:fixed"><div class="gj-m-notice" data-tone="default"><span class="gj-m-notice-text">${t}</span></div></div>`;clearTimeout(toast.t);toast.t=setTimeout(()=>h.innerHTML='',3000)};
let opener=null;
const open=(id,from)=>{opener=from;const L=document.getElementById(id);L.hidden=false;document.body.style.overflow='hidden';const f=L.querySelector('textarea')||L.querySelector('[data-close]');f.focus()};
const close=()=>{document.querySelectorAll('.layer').forEach(l=>l.hidden=true);document.body.style.overflow='';if(opener)opener.focus()};
document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',close));
document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
document.getElementById('reject').addEventListener('click',e=>open('rejectLayer',e.currentTarget));
document.getElementById('approve').addEventListener('click',e=>open('approveLayer',e.currentTarget));
const ta=document.querySelector('#ta textarea'),cnt=document.querySelector('#ta .gj-m-textarea-count');
ta.addEventListener('input',()=>{cnt.textContent=ta.value.length+'/200';const m=document.getElementById('taErr');if(m&&ta.value.trim()){m.remove();document.getElementById('ta').classList.remove('is-error')}});
const finish=(state,tone,step,desc,msg)=>{close();const s=document.getElementById('state');s.textContent=state;s.className='gj-m-tag gj-m-tag-line gj-m-tag-'+tone;const d=new Date(),z=n=>String(n).padStart(2,'0');flow[2]=[step==='驳回'?'error':'finish',`${z(d.getMonth()+1)}-${z(d.getDate())} ${z(d.getHours())}:${z(d.getMinutes())}`,'我 '+step,desc];if(step!=='驳回')flow[3][0]='process';drawFlow();document.getElementById('bar').remove();document.getElementById('main').style.paddingBottom='calc(var(--space-24) + var(--safe-bottom))';toast(msg)};
document.getElementById('rejectOk').addEventListener('click',()=>{if(!ta.value.trim()){const w=document.getElementById('ta');w.classList.add('is-error');if(!document.getElementById('taErr'))w.insertAdjacentHTML('afterend','<div class="gj-m-input-message" role="alert" id="taErr">请填写驳回原因</div>');ta.focus();return}finish('已驳回','red','驳回',ta.value.trim(),'已驳回，已通知李明')});
document.getElementById('approveOk').addEventListener('click',()=>finish('已同意','green','同意','','已同意，流转至财务复核'));
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>toast('打开「'+b.dataset.view+'」预览（原型）')));
})();
</script>
