  const stage=R('info-list','list',{cls:'gj-m-info-list-compact gj-m-info-list-plain',rows:[{label:'服务阶段：',value:esc(C.stage)}]});
  const details=S.more?`<div class="cu-expanded"><p class="cu-services"><span>已签（${C.services.length}）：</span>${C.services.map((name,i)=>`${i<5?`<a href="javascript:void 0" data-signed>${esc(name)}</a>`:esc(name)}${i<C.services.length-1?'、':''}`).join('')}</p><div class="cu-risk"><span>风测到期：</span><strong>${C.riskDate}</strong>${R('tag','tag',{text:C.riskReminder,color:'orange',small:true})}</div><div class="cu-info">${stage}${toggle}</div></div>
    <section class="cu-note" aria-label="标签备注"><div class="cu-note-head"><h2>标签备注</h2>${R('chart','progressInline',{rows:[{name:'KYC完成',value:C.kyc,text:C.kyc+'%'}]})}${R('text-button','textButton',{text:'编辑',size:'small',blue:true,lead:icon('icf_system_edit'),attrs:' data-edit-profile aria-label="编辑客户标签备注"'})}</div><div class="cu-tags">${C.noteTags.map(text=>R('tag','tag',{text,color:'grey'})).join('')}</div><div class="cu-note-text"><span>备注信息</span><p>${esc(C.note)}</p></div></section>`:`<div class="cu-info">${R('info-list','list',{cls:'gj-m-info-list-compact gj-m-info-list-plain',rows:[{label:'已签（30）：',value:`<a class="cu-link" href="javascript:void 0" data-signed title="${esc(C.signed)}">${esc(C.signed)}</a>`},{label:'服务阶段：',value:esc(C.stage)}]})}${toggle}</div>`;
  return card('cu','',`<div class="cu-head">
    <div><div class="cu-name">${mk}<h1>${esc(C.name)}</h1><span class="cu-meta">${C.gender} ${C.age}岁</span></div>
      <div class="cu-id"><span class="num" aria-label="客户号">${C.id}</span>${R('text-button','textButton',{text:'切换',size:'small',blue:true,lead:icon('icf_Arrow_transfer'),attrs:' data-switch aria-label="切换客户账户"'})}</div></div>
    <div class="cu-tags">${(S.more?C.expandedTags:C.tags).map(([text,color])=>R('tag','tag',{text,color})).join('')}</div>
    ${details}</div>`,{top:true});
}

/* 环形图：路径按占比生成（与图表组件 pie 写法一致） */
function donut(parts){const tot=parts.reduce((a,p)=>a+p[1],0);let a0=-Math.PI/2;const R1=50,R0=37;const pt=(r,a)=>`${50+r*Math.cos(a)},${50+r*Math.sin(a)}`;
  return parts.map((p,i)=>{const a1=a0+Math.max(p[1]/tot*2*Math.PI,.02);const big=a1-a0>Math.PI?1:0;const d=`M${pt(R1,a0)} A${R1},${R1} 0 ${big} 1 ${pt(R1,a1)} L${pt(R0,a1)} A${R0},${R0} 0 ${big} 0 ${pt(R0,a0)} Z`;a0=a1;return `<path class="gj-m-chart-slice gj-m-chart-s${i+1}" d="${d}"></path>`}).join('')}
function assets(){const net=S.asset==='net';const amt=net?ASSET.total-ASSET.debt:ASSET.total;const parts=ASSET.parts.map(p=>p[0]==='场内'&&net?[p[0],p[1]-ASSET.debt,p[2]]:p);
  const [int,dec]=amt.toFixed(2).split('.');
  const seg=`<div class="as-seg">${R('tabs','tabs',{label:'资产口径',kind:'segment',size:'small',items:['总资产','净资产'].map((t,i)=>({text:t,selected:(i===1)===net,tabindex:(i===1)===net?0:-1}))})}</div>`;
  return card('as','',`<div class="stack">
    <div class="as-top">${seg}<div class="as-head"><p class="as-amount" aria-label="${net?'净资产':'总资产'} ${Number(int).toLocaleString('zh-CN')}.${dec} 元"><small>¥</small><strong>${Number(int).toLocaleString('zh-CN')}</strong><span>.${dec}</span></p>${caption('数据统计截至 '+ASSET.date)}</div></div>
    <div class="gj-m-chart-pie-wrap"><div class="gj-m-chart-pie" role="img" aria-label="资产分布：${parts.map(p=>p[0]+p[2]+'%').join('，')}"><svg viewBox="0 0 100 100" aria-hidden="true">${donut(parts)}</svg><div class="gj-m-chart-pie-center"><span class="gj-m-chart-pie-total">${wan(amt).replace('万','')}</span><span class="gj-m-chart-pie-unit">万元</span></div></div>
      <div class="gj-m-chart-legend-v">${parts.map((p,i)=>`<span class="gj-m-legend-data"><span class="gj-m-legend gj-m-chart-s${i+1}"><span class="gj-m-legend-mark is-stack" aria-hidden="true"></span>${p[0]}</span><span class="gj-m-legend-value">${wan(p[1])}<span class="pct">${p[2]}%</span></span></span>`).join('')}</div></div>
    <p class="as-foot">融资负债 ${wan(ASSET.debt)} · 维保比例 ${ASSET.ratio}</p></div>`);
}
/* 折线图：客户收益率 vs 沪深300（同为 %，单 Y 轴，从 0 起不截断） */
function chart(){const fit=(d,end)=>{const last=d[d.length-1]||1;return d.map((v,i)=>+(v+(end-last)*i/(d.length-1)).toFixed(2))};const a=fit(series(S.period,S.scope,0),rateOf()),b=fit(series(S.period,'全账户',1),PERF[S.period].hs);
  const lines=[{n:'客户收益率',s:1,d:a},{n:'沪深300',s:3,d:b}];const vis=lines.filter(l=>!S.off[l.n]);const all=vis.flatMap(l=>l.d).concat(0);
  let lo=Math.floor(Math.min(...all)/2)*2,hi=Math.ceil(Math.max(...all)/2)*2;if(hi===lo)hi=lo+2;const step=Math.max(2,Math.ceil((hi-lo)/4/2)*2);lo=Math.floor(lo/step)*step;hi=lo+step*4;if(hi<Math.max(...all))hi+=step;
  const ticks=[];for(let v=hi;v>=lo;v-=step)ticks.push(v);const y=v=>((hi-v)/(hi-lo)*100);const n=a.length;const x=i=>i/(n-1)*100;
  const yt=ticks.map(v=>`<div class="gj-m-chart-ytick${v===0?' is-solid':''}" style="top:${y(v).toFixed(2)}%"><span class="gj-m-chart-ylabel">${v}%</span></div>`).join('');
  const poly=vis.map(l=>`<polyline class="gj-m-chart-line gj-m-chart-s${l.s}" points="${l.d.map((v,i)=>x(i).toFixed(2)+','+y(v).toFixed(2)).join(' ')}"></polyline>`).join('');
  const t=S.tip;const tip=t<0?'':`<div class="gj-m-chart-indicator" style="left:${x(t).toFixed(2)}%">${vis.map(l=>`<span class="gj-m-chart-indicator-dot gj-m-chart-s${l.s}" style="top:${y(l.d[t]).toFixed(2)}%"></span>`).join('')}</div><div class="gj-m-chart-tip${t>n/2?' is-left':''}" style="--x:${x(t).toFixed(2)}">${vis.map(l=>`<div class="gj-m-chart-tip-row"><span class="gj-m-chart-tip-name gj-m-chart-s${l.s}">${l.n}</span><span class="gj-m-chart-tip-value">${sign(l.d[t].toFixed(2))}<span class="gj-m-chart-tip-unit">%</span></span></div>`).join('')}</div>`;
  const xl=MONTHS[S.period].map((m,i,arr)=>`<div class="gj-m-chart-xtick${i===0?' is-start':i===arr.length-1?' is-end':''}" style="left:${i/(arr.length-1)*100}%"><span class="gj-m-chart-xlabel">${m}</span></div>`).join('');
  const legendVal={'客户收益率':sign(rateOf())+'%','沪深300':sign(PERF[S.period].hs)+'%'};
  return `<div class="pf-chart"><div class="gj-m-chart-legend pf-legend">${lines.map(l=>`<span class="gj-m-legend-data"><button type="button" class="gj-m-legend gj-m-chart-s${l.s}${S.off[l.n]?' is-off':''}" aria-pressed="${!S.off[l.n]}" data-series="${l.n}"><span class="gj-m-legend-mark is-line" aria-hidden="true"></span>${l.n}</button><span class="gj-m-legend-value">${legendVal[l.n]}</span></span>`).join('')}</div>
    <div class="gj-m-chart-axes" style="--gj-m-chart-h:1.4rem;--gj-m-chart-y-w:.32rem">${yt}<div class="gj-m-chart-plot" role="img" aria-label="${S.scope}${S.period}收益率走势：客户 ${legendVal['客户收益率']}，沪深300 ${legendVal['沪深300']}" data-plot><svg class="gj-m-chart-line-svg" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">${poly}</svg>${tip}</div></div>
    <div class="gj-m-chart-xaxis" style="--gj-m-chart-y-w:.32rem">${xl}</div></div>`;
}
function perf(){const P=PERF[S.period],k=SCOPE_K[S.scope];
  if(S.perfFail)return card('pf','投资表现',`<div class="mod-fail"><span>数据加载失败</span>${R('text-button','textButton',{text:'重新加载',size:'small',blue:true,attrs:' data-perf-retry'})}</div>`);
  const sel=R('select','select',{size:'m',label:'统计周期',key:'period',value:S.period}).replace('aria-expanded="false"','aria-expanded="false" id="periodBtn"');
  const rate=rateOf(),gain=Math.round(P.gain*k),asset=Math.round(P.asset*k);
  const grid=R('metric','grid',{left:true,size:'n6',items:[{num:wan(asset),label:'期末资产'},{num:(gain<0?'-':'+')+wan(Math.abs(gain)),label:'收益额',tone:tone(gain)},{num:sign(rate)+'%',label:'收益率',tone:tone(rate)},{num:P.dd+'%',label:'最大回撤'}]});
  return card('pf','投资表现',`<div class="stack">
    <div class="pf-tools">${tabs('统计范围',SCOPES,SCOPES.indexOf(S.scope))}${sel}</div>
    ${grid}${chart()}
    ${R('listbar','list',{items:R('listbar','item',{link:true,prefix:icon('icf_data_chart'),text:'多维账户分析',desc:'持仓 · 盈亏 · 交易画像',attrs:' data-analysis'})})}</div>`,{sub:'数据统计截至 09-02'});
}
function signal(s,key,idx){const t=s.dir==='买入'?'red':'green';
  return `<div class="sig"><div class="sig-head">${R('tag','tag',{text:s.dir,color:t,small:true,filled:true})}<h4>${esc(s.name)}</h4><span class="ho-sub">当前信号涨幅 <span class="num ${tone(s.chg)}">${sign(s.chg)}%</span></span></div>
    ${R('metric','grid',{left:true,size:'n6',items:s.f.map(([l,v,hl])=>({num:hl?`<span style="color:var(--ds-text-blue)">${v}</span>`:v,label:l}))})}</div>`}
function holdItem(h){const sigs=h.sig||[];const open=!!S.openSig[h.code];
  const sigHtml=sigs.length?`<div class="sig-wrap"><p class="sig-label">${icon('icf_data_chart2')}关联信号 ${sigs.length}</p>${signal(sigs[0])}${sigs.length>1&&open?sigs.slice(1).map(signal).join(''):''}${sigs.length>1?`<div class="ho-more">${R('text-button','textButton',{text:open?'收起':`展开 ${sigs.slice(1).map(s=>s.name).join('、')} 信号`,size:'small',blue:true,attrs:` data-sig="${h.code}" aria-expanded="${open}"`})}</div>`:''}</div>`:'';
  return `<article class="ho-item" aria-label="${h.name}"><div class="ho-title"><div><h3>${esc(h.name)}</h3><p class="ho-sub"><span class="num">${h.code}</span> · 持有 ${h.days} 天</p></div><div class="ho-mv"><div class="ho-mv-line"><span class="ho-sub">市值</span><span class="num">${h.mv.toLocaleString('zh-CN')}</span></div><span class="ho-sub">仓位 ${h.pos}%</span></div></div>
    ${R('metric','grid',{left:true,size:'n6',items:[{num:(h.gain>0?'+':'')+h.gain.toLocaleString('zh-CN'),label:'持有收益',tone:tone(h.gain)},{num:sign(h.rate)+'%',label:'收益率',tone:tone(h.rate)},{num:h.cost,label:'成本'},{num:h.price,label:'现价'}]})}
    <div class="ho-tags">${h.tags.map(t=>R('tag','tag',{text:t,color:'grey',small:true})).join('')}</div>${sigHtml}</article>`}
function holdings(){
  const head=tabs('持仓与交易',['持仓','交易'],S.hold==='持仓'?0:1,{kind:'secondary',size:''});
  let body;
  if(S.hold==='交易')body=R('listbar','list',{cls:'tr-list',inCard:true,items:TRADES.map(([d,dir,n,q,a])=>R('listbar','item',{prefix:'',text:`${R('tag','tag',{text:dir,color:dir==='买入'?'red':'green',small:true,filled:true})} ${esc(n)}`,desc:`${d} · ${q}`,extra:`<span class="num">${wan(Math.abs(a))}</span>`})).join('')});
  else if(S.cat!==0){const c=CATS[S.cat];body=`<div class="mod-fail" style="padding:var(--space-24) 0"><span>${c[0]} ${c[2]} 只 · 占比 ${c[1]}%（原型仅演示股票明细）</span></div>`}
  else{const list=STOCKS.filter(s=>!S.sector||s.sector===S.sector);const shown=list.slice(0,S.shown);const total=STOCKS.reduce((a,s)=>a+s.mv,0),gain=STOCKS.reduce((a,s)=>a+s.gain,0);
    body=`<div class="stack"><div class="ho-sum"><p>股票 ${STOCKS.length} 只 · 合计 ${wan(total)} · 持有收益 <span class="${tone(gain)}">${(gain<0?'-':'+')+wan(Math.abs(gain))}</span></p>${caption('数据统计截至 09-02')}</div>
      <div class="ho-sectors" role="group" aria-label="按板块筛选">${SECTORS.map(([n,c,v])=>`<button type="button" class="ho-sector${v?' is-'+tone(v):''}" aria-pressed="${S.sector===n}" data-sector="${n}"><b>${n} ${c}只</b>${v?`<span class="num">${v>0?'▲':'▼'}${Math.abs(v)}%</span>`:''}</button>`).join('')}</div>
      <div class="ho-list">${shown.length?shown.map(holdItem).join(''):`<p class="mod-fail">该板块暂无持仓</p>`}</div>
      ${list.length>S.shown?`<div class="ho-more">${R('text-button','textButton',{text:`查看更多持仓（${list.length-S.shown}）`,size:'small',blue:true,attrs:' data-more-hold'})}</div>`:''}</div>`}
  const cat=S.hold==='持仓'?tabs('资产类别',CATS.map(c=>`${c[0]} ${c[1]}%`),S.cat,{scroll:true}):'';
  return R('card','card',{cls:'gj-m-card-l0',id:'ho',attrs:' aria-label="持仓与交易"',content:`<div class="stack">${head}${cat}${body}</div>`});
}
function skeleton(){return [1,2,3].map((x,i)=>R('card','card',{cls:'gj-m-card-l0'+(i?'':' gj-m-card-l0-top'),attrs:' aria-busy="true"',content:R('skeleton','lines',{lines:[{w:40},{w:100},{w:85},{w:60,tail:true}]})})).join('')}

/* ---------------- 渲染 ---------------- */
function render(keepScroll){const y=scrollY;
  $('#top').innerHTML=R('navbar','navbar',{back:true,title:'客户账户',right:''});
  if(S.state==='loading')$('#page').innerHTML=skeleton();
  else if(S.state==='network')$('#page').innerHTML=`<div class="full-empty">${R('empty','empty',{type:'network',title:'网络连接异常',desc:'请检查网络后重新加载',action:R('button','button',{level:'primary',text:'重新加载',attrs:' data-reload'})})}</div>`;
  else $('#page').innerHTML=profile()+assets()+perf()+holdings();
  wire();if(keepScroll)scrollTo(0,y)}
function renderTabbar(){$('#tabbar').innerHTML=`<div class="tabbar-fixed">${R('tabbar','tabbar',{safe:true,items:[['账户','icf_business_wallet','icf_business_wallet-fill'],['服务','icf_data_chart1','icf_data_chart1-fill'],['动态','icf_system_bell','icf_system_bell-fill']].map(([label,ic,on],i)=>({label,icon:ic,iconOn:on,active:i===0}))})}</div>`;
  $('#fab').innerHTML=R('floating-button','fab',{cls:'page-fab',blue:true,label:'搜索客户',icon:'icf_system_search',attrs:' data-search'});
  $$('.gj-m-tabbar-item').forEach((b,i)=>b.addEventListener('click',()=>{if(i)toast(`进入「${b.textContent.trim()}」（原型未实现）`)}));
  $('[data-search]').addEventListener('click',()=>toast('打开客户搜索（原型未实现）'))}
let tt;function toast(t){$('#toast').innerHTML=R('notice','toast',{text:t});clearTimeout(tt);tt=setTimeout(()=>$('#toast').innerHTML='',2400)}

/* 页签（按钮式 / 主级 / 分段）：点击与左右键 */
function wireTabs(sel,fn){const tl=$(sel);if(!tl)return;const ts=[...tl.querySelectorAll('.gj-m-tab')];
  ts.forEach((t,i)=>{t.addEventListener('click',()=>fn(i));t.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();const j=(i+(e.key==='ArrowRight'?1:ts.length-1))%ts.length;fn(j);setTimeout(()=>{const n=$(sel);n&&n.querySelectorAll('.gj-m-tab')[j].focus()})}})})}
function wire(){
  const on=(s,ev,fn)=>$$(s).forEach(el=>el.addEventListener(ev,e=>fn(el,e)));
  on('.gj-m-navbar-back','click',()=>toast('返回客户列表（原型不跳转）'));
  on('[data-reload]','click',()=>{S.state='loading';render();setTimeout(()=>{S.state='normal';render()},700)});
  on('[data-switch]','click',()=>toast('切换至该客户的其他资金账户（原型未实现）'));
  on('[data-signed]','click',(el,e)=>{e.preventDefault();toast('进入已签服务列表（原型不跳转）')});
  on('[data-edit-profile]','click',()=>toast('编辑客户标签备注（原型暂不保存）'));
  on('[data-more]','click',()=>{S.more=!S.more;render(true);$('[data-more]').focus()});
  wireTabs('#as .gj-m-tabs',i=>{S.asset=i?'net':'total';render(true)});
  wireTabs('#pf .pf-tools .gj-m-tabs',i=>{S.scope=SCOPES[i];S.tip=-1;render(true)});
  on('[data-perf-retry]','click',()=>{S.perfFail=false;render(true)});
  on('#periodBtn','click',el=>openPeriod(el));
  wireChart();
  on('[data-analysis]','click',(el,e)=>{e.preventDefault();toast('进入多维账户分析（原型不跳转）')});
  wireTabs('#ho .gj-m-tabs[data-kind="secondary"]',i=>{S.hold=i?'交易':'持仓';render(true)});
  wireTabs('#ho .gj-m-tabs[data-kind="round"]',i=>{S.cat=i;S.sector='';S.shown=3;render(true)});
  on('[data-sector]','click',el=>{const n=el.dataset.sector;S.sector=S.sector===n?'':n;S.shown=3;render(true);$(`[data-sector="${n}"]`).focus()});
  on('[data-more-hold]','click',()=>{S.shown+=3;render(true)});
  on('[data-sig]','click',el=>{const c=el.dataset.sig;S.openSig[c]=!S.openSig[c];render(true);$(`[data-sig="${c}"]`).focus()});
}
function wireChart(){const on=(s,ev,fn)=>$$(s).forEach(el=>el.addEventListener(ev,e=>fn(el,e)));
  on('[data-series]','click',el=>{const n=el.dataset.series;const vis=['客户收益率','沪深300'].filter(k=>!S.off[k]);if(!S.off[n]&&vis.length===1){toast('至少保留一条折线');return}S.off[n]=!S.off[n];const host=$('#pf .pf-chart');host.outerHTML=chart();wireChart();$(`[data-series="${n}"]`).focus()});
  const plot=$('[data-plot]');if(plot){const pick=e=>{const r=plot.getBoundingClientRect();const i=Math.round(Math.min(1,Math.max(0,(e.clientX-r.left)/r.width))*23);if(i!==S.tip){S.tip=i;const host=$('#pf .pf-chart');host.outerHTML=chart();wireChart()}};
    plot.addEventListener('pointerdown',pick);plot.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='mouse')pick(e)})}
}
/* 统计周期：底部弹层单选（selection-list.popupSingle 结构） */
function openPeriod(trigger){let cur=S.period;trigger.setAttribute('aria-expanded','true');document.body.style.overflow='hidden';
  const draw=()=>{$('#layer').innerHTML=`<div class="layer"><div class="gj-m-popup"><div class="gj-m-popup-panel" role="dialog" aria-modal="true" aria-labelledby="pdT" tabindex="-1"><div class="gj-m-popup-header"><span class="gj-m-popup-title" id="pdT">统计周期</span><button type="button" class="gj-m-popup-close" aria-label="关闭"><span class="gj-icon" aria-hidden="true"></span></button></div>${R('selection-list','single',{label:'统计周期',items:PERIODS.map(t=>({text:t,on:t===cur}))})}<div class="gj-m-popup-footer">${R('button','button',{size:'large',level:'tertiary',text:'取消',attrs:' data-cancel'})}${R('button','button',{size:'large',level:'primary',text:'确定',attrs:' data-ok'})}</div></div></div></div>`;
    const close=ok=>{if(ok){S.period=cur;S.tip=-1}$('#layer').innerHTML='';document.body.style.overflow='';render(true);const b=$('#periodBtn');b&&b.focus()};
    $$('#layer .gj-m-selection-item').forEach(b=>b.addEventListener('click',()=>{cur=b.dataset.v;draw();$(`#layer [data-v="${cur}"]`).focus()}));
    $('#layer .gj-m-popup-close').addEventListener('click',()=>close());$('#layer [data-cancel]').addEventListener('click',()=>close());$('#layer [data-ok]').addEventListener('click',()=>close(true));
    $('#layer .gj-m-popup').addEventListener('click',e=>{if(e.target.classList.contains('gj-m-popup'))close()});
    $('#layer .gj-m-popup-panel').addEventListener('keydown',e=>{if(e.key==='Escape')close()})};
  draw();$('#layer .gj-m-popup-panel').focus()}

renderTabbar();
if(S.state==='loading'){render();setTimeout(()=>{S.state='normal';render()},900)}else render();
})();
